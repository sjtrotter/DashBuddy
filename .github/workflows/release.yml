name: Release

# A version tag publishes; merges never do. docs/RELEASE.md is the runbook.
# - The Play build (`release`, cloud.trotter.log.gig) goes to the Play internal testing track, while the
#   repository variable PLAY_PUBLISH is true. Otherwise a notice says Play was skipped and the rest still runs.
# - The sideload and debug APKs go to a GitHub Release for the tag.
# The tag is vMAJOR.MINOR.PATCH on master and must equal baseVersionName in app/build.gradle.kts: that file owns
# the version, the tag confirms it. Version code = major*1_000_000 + minor*1_000 + patch, for the Play and sideload
# builds only; the debug build keeps code 1. Tags only go up. A run that failed before the Play upload can be
# re-run; once an upload reached Play its version code is spent, so fix it with the next patch tag.
#
# Secrets (the `release` environment, which only version tags can use, so no branch workflow reads them):
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD      the Play upload key (required when PLAY_PUBLISH)
#   SIDELOAD_KEYSTORE_BASE64, SIDELOAD_STORE_PASSWORD, SIDELOAD_KEY_ALIAS, SIDELOAD_KEY_PASSWORD   always required
# Secrets (repository, shared with pr-check.yml): DEBUG_KEYSTORE_BASE64, DEBUG_KEYSTORE_PASSWORD, always required.
# Variables (repository): PLAY_PUBLISH, PLAY_WIF_PROVIDER, PLAY_SERVICE_ACCOUNT. Keyless auth accepts this repo (by
# id) only from the `release` environment on a v* tag, or the `play-listing` environment on master (docs/RELEASE.md §4).
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, id-token: write }
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Expected vMAJOR.MINOR.PATCH with non-negative integers and no leading zeros."
            exit 1
          fi
          if (( ${#minor} > 3 || ${#patch} > 3 )); then
            echo "::error::Minor and patch must each be at most 999."
            exit 1
          fi
          if (( ${#major} > 4 || major > 2099 )); then
            echo "::error::Major must be at most 2099 (Play's version code limit is 2100000000)."
            exit 1
          fi
          code=$(( major*1000000 + minor*1000 + patch ))
          if (( code < 1 )); then
            echo "::error::v0.0.0 has no valid version code."
            exit 1
          fi
          prerelease=false
          (( major == 0 )) && prerelease=true
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version ${TAG#v}: code $code, prerelease=$prerelease"

      - name: Refuse a tag that is not on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The release tag must point to a commit on master."
            exit 1
          fi

      - name: Refuse a tag that differs from the build file's version
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          base="$(sed -nE 's/^[[:space:]]*val baseVersionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          if [ "$(printf '%s' "$base" | grep -c '')" != 1 ]; then
            echo "::error::Expected exactly one baseVersionName in app/build.gradle.kts."
            exit 1
          fi
          if [ "$base" != "$NAME" ]; then
            echo "::error::The tag says $NAME but app/build.gradle.kts says $base. Bump baseVersionName in a PR first, or tag $base."
            exit 1
          fi

      - name: Refuse to run without secrets or variables
        id: secrets
        env:
          PLAY_PUBLISH: ${{ vars.PLAY_PUBLISH }}
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          SIDELOAD_STORE_PASSWORD: ${{ secrets.SIDELOAD_STORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          ok=1
          missing() { echo "::error::$1 is missing; see docs/RELEASE.md, Secrets and variables."; ok=0; }
          for n in SIDELOAD_KEYSTORE_BASE64 SIDELOAD_STORE_PASSWORD SIDELOAD_KEY_ALIAS SIDELOAD_KEY_PASSWORD \
                   DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD; do
            [ -n "${!n}" ] || missing "$n"
          done
          upload=true
          for n in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!n}" ] || upload=false
          done
          # The one publish decision: exact lowercase `true`. The auth and upload steps read this output, never
          # vars.PLAY_PUBLISH, because an Actions expression compares strings case-insensitively.
          publish=false
          if [ "$PLAY_PUBLISH" = true ]; then
            publish=true
            for n in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!n}" ] || missing "$n"
            done
            for n in PLAY_WIF_PROVIDER PLAY_SERVICE_ACCOUNT; do
              [ -n "${!n}" ] || missing "the $n variable"
            done
          else
            echo "::notice::PLAY_PUBLISH is not true: the Play upload is skipped. The GitHub Release still gets the APKs."
          fi
          [ "$ok" = 1 ] || exit 1
          [ "$upload" = true ] || echo "::notice::No upload key: the Play bundle (AAB) is not built."
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Read-only: a release builds every task itself and writes nothing back for PR runs to restore.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Materialize the keystores (runner temp, never the workspace)
        env:
          UPLOAD: ${{ steps.secrets.outputs.upload }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SIDELOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/giglog-sideload.jks"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/giglog-debug.jks"
          if [ "$UPLOAD" = true ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/giglog-upload.jks"
          fi

      - name: Build the Play, sideload and debug builds
        shell: bash
        env:
          UPLOAD: ${{ steps.secrets.outputs.upload }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIDELOAD_KEYSTORE_PATH: ${{ runner.temp }}/giglog-sideload.jks
          SIDELOAD_STORE_PASSWORD: ${{ secrets.SIDELOAD_STORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/giglog-debug.jks
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          tasks=(:app:assembleRelease :app:assembleSideload :app:assembleDebug)
          if [ "$UPLOAD" = true ]; then
            # Set only with the key in place: the build treats any KEYSTORE_PATH as a configured key.
            export KEYSTORE_PATH="$RUNNER_TEMP/giglog-upload.jks"
            tasks+=(:app:bundleRelease)
          fi
          ./gradlew --parallel --max-workers=4 "${tasks[@]}" \
            -PgiglogVersionCode="$CODE" -PgiglogVersionName="$NAME"

      # The release APK and the AAB come from the same merged resources, so the APK speaks for the bundle.
      - name: Verify each build's accessibility-tool flag and version code
        shell: bash
        env:
          CODE: ${{ steps.version.outputs.code }}
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          check() { # <apk> <expected flag> <expected version code>
            # A minified build shortens resource paths (res/xml/accessibility_service_config.xml becomes something
            # like res/Xy.xml), so find the file through the resource table, by its resource name.
            cfg="$("$aapt2" dump resources "$1" | grep -A1 -E 'xml/accessibility_service_config$' \
              | sed -nE 's/.*\(file\) ([^ ]+) type=XML.*/\1/p' | head -1 || true)"
            [ -n "$cfg" ] || { echo "::error::$1 has no xml/accessibility_service_config resource"; exit 1; }
            flag="$("$aapt2" dump xmltree "$1" --file "$cfg" \
              | grep -oE 'isAccessibilityTool[^=]*=[a-z]+' | sed 's/.*=//' || true)"
            vc="$("$aapt2" dump badging "$1" | sed -nE "s/^package: .* versionCode='([0-9]+)'.*/\1/p" || true)"
            echo "$1: isAccessibilityTool=$flag versionCode=$vc"
            if [ "$flag" != "$2" ] || [ "$vc" != "$3" ]; then
              echo "::error::$1 must declare isAccessibilityTool=$2 and versionCode $3"
              exit 1
            fi
          }
          # app-release.apk with the upload key, app-release-unsigned.apk without it.
          release=(app/build/outputs/apk/release/*.apk)
          [ "${#release[@]}" = 1 ] || { echo "::error::Expected one release APK, found ${release[*]}"; exit 1; }
          check "${release[0]}" false "$CODE"
          check app/build/outputs/apk/sideload/app-sideload.apk true "$CODE"
          check app/build/outputs/apk/debug/app-debug.apk true 1

      - name: Collect the APKs
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/sideload/app-sideload.apk "$RUNNER_TEMP/dist/giglog-sideload-$NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/dist/giglog-debug-$NAME.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

      # Before the Play upload, so a failed or skipped upload still leaves the bundle for a manual one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.upload == 'true'
        with:
          name: play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # After the build, so no Gradle task runs while the Google credential exists.
      - id: auth
        if: steps.secrets.outputs.publish == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - name: Upload the Play build to the internal track
        if: steps.secrets.outputs.publish == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: cloud.trotter.log.gig
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Scrub the keystores
        if: always()
        run: rm -f "$RUNNER_TEMP"/giglog-*.jks

  # Release write permission stays out of the job that holds signing material.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apks
          path: dist

      - name: Create or update the GitHub Release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.publish.outputs.name }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A Release made by hand keeps its notes; the APKs go up before it leaves draft.
            gh release upload "$TAG" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE"
          else
            args=()
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --title "$NAME" "${args[@]}"
          fi
