name: PR Check

on:
  pull_request:
    branches: [ master ]
  # #1450 — a master push writes the Gradle cache PRs restore read-only, and catches merge skew.
  push:
    branches: [ master ]
  # #902 — escape hatch for a dispatch-refused PR (Actions refused to create runs for one
  # PR's tree across 4 shas/3 PRs on 2026-07-27; branch protection made it unmergeable).
  # Dispatch with the PR number: the job checks out that PR's MERGE ref (the same tree a
  # pull_request run would test) and reports a `build-and-test` commit status back onto the
  # PR's head SHA, so the required check turns green through the normal path instead of an
  # admin override.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to run against (checks out refs/pull/<pr>/merge, reports status to its head SHA)'
        required: true
        type: string

# #1450 — PR CI is the pre-PR gate, so a new push supersedes the running check of the same PR.
# The event name keeps a PR push from cancelling a #902 dispatch run or a master run.
concurrency:
  group: pr-check-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The workflow_dispatch escape hatch (CLAUDE.md § Git Workflow) posts a real `build-and-test`
    # commit status onto the PR head; the default GITHUB_TOKEN cannot (`Resource not accessible by
    # integration`, seen on PR #1075's dispatched run 34070019980), so the job asks for it explicitly.
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    # Docs-only PRs skip via the literal token `[skip ci]` in the PR BODY (see CLAUDE.md).
    # #902 footgun guard: a PR whose body merely DESCRIBES the token (PR #928 documented the
    # mechanism and silently skipped its own CI) can force the run back on with `[force ci]`.
    # A workflow_dispatch run has no PR body — contains(null, …) is false — so it always runs.
    if: ${{ !contains(github.event.pull_request.body, '[skip ci]') || contains(github.event.pull_request.body, '[force ci]') }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty ref (pull_request events) keeps the default merge-commit checkout; a
          # workflow_dispatch run substitutes the named PR's merge ref (#902).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          # #1450 — a dispatch run needs the merge commit's parents to pin the head it tests.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 2 || 1 }}

      - name: Pin the tested PR head (dispatch runs only)
        # #1450 — the merge ref's second parent IS the head this run tests; reading the head from the
        # API at report time could mark a commit pushed mid-run green.
        id: pin
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "head=$(git rev-parse --verify HEAD^2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        # #1450 — writes its cache only from master (the push run); PRs restore it read-only.
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile (main and test sources, every module reports)
        # #1450 — a broken build fails here in minutes instead of after the whole gate.
        shell: bash  # an explicit shell means -eo pipefail, so tee cannot mask the exit status
        run: ./gradlew --continue compileDebugUnitTestKotlin :domain:compileTestKotlin 2>&1 | tee compile.log

      - name: Gate (debug APK, unit tests, release lint)
        # One invocation with --continue (#1450): a red module no longer hides the rest.
        # :domain is pure-JVM — its task is `test`, which the Android aggregate does NOT
        # include; without it every :domain test is CI-invisible (#617 review / #590 gap).
        # #1173 review: :domain:test covers the census-contract included build's tests; the alias is harmless.
        # #907 — lintVitalRelease: PR CI once built/tested only the debug variant, so a release-only
        # break (16 ExtraTranslation errors from the #98 :feature:setup extraction) shipped invisibly.
        shell: bash
        run: |
          ./gradlew --continue :app:assembleDebug testDebugUnitTest :domain:test censusContractTest \
            :app:lintVitalRelease 2>&1 | tee gate.log

      - name: Schemas committed (Room export drift)
        # With the destructive fallback retired (#690), an uncommitted Room schema export is a
        # missing upgrade path that only crashes on a device. KSP regenerated the schemas during
        # the build/test steps above; if that produced a JSON diff (or a new untracked file) the
        # bump was committed without its schema — fail the job.
        run: |
          git diff --exit-code -- core/database/schemas && test -z "$(git status --porcelain core/database/schemas)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.event.pull_request.number || inputs.pr || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Gate summary
        # #1450 — failing tests and compile errors on the run page and in gate-summary.txt, the one file
        # the session and the adversarial review read. Same script the session runs on downloaded results.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 tools/ci/junit_summary.py . compile.log gate.log | tee gate-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Print 20 slowest test classes
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          timings = []
          for path in sorted(Path('.').glob('**/build/test-results/**/*.xml')):
              try:
                  root = ET.parse(path).getroot()
                  for suite in root.iter('testsuite'):
                      timings.append((float(suite.get('time', '0')), suite.get('name', '?'), str(path)))
              except (ET.ParseError, ValueError) as error:
                  print(f'Could not read {path}: {error}')
          lines = ['20 slowest test classes (JUnit seconds; not task wall time):']
          lines += [f'{seconds:9.3f}s  {name}  [{path}]'
                    for seconds, name, path in sorted(timings, reverse=True)[:20]]
          if not timings:
              lines.append('No JUnit results found (tests may not have run).')
          report = '\n'.join(lines) + '\n'
          print(report, end='')
          Path('test-timings.txt').write_text(report)
          PY

      - name: Upload JUnit results and timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ github.event.pull_request.number || inputs.pr || github.sha }}
          path: |
            **/build/test-results/**/*.xml
            test-timings.txt
            gate-summary.txt
            compile.log
            gate.log
          retention-days: 7

      - name: Report status to PR head (dispatch runs only)
        # #902 — a workflow_dispatch run is not attached to the PR, so its result would never
        # satisfy the required `build-and-test` check. Post a commit status with that exact
        # context onto the PR's HEAD sha (branch protection accepts a commit status of the
        # same name). A red dispatch run reports failure, not silence; a cancelled one reports nothing,
        # and the status goes only to the head pinned before the build (#1450).
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pin.outputs.head }}" \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="build-and-test" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="manual dispatch run (#902 escape hatch)"

# (tree-nudge: Actions refused to dispatch for the original tree — the exact #902 class this PR mitigates; see issue #902 forensics)
