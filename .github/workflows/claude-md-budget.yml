name: CLAUDE.md budget

# #1466: CLAUDE.md loads into every agent session, so its size is a budget. This job fails when the file passes
# 40,000 bytes. It is its own workflow, with no docs-only skip, because docs-only PRs (the ones that skip
# pr-check.yml's gate) are the ones that edit CLAUDE.md alone. Raising the budget is a reviewed one-line change.
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  claude-md-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: CLAUDE.md
          sparse-checkout-cone-mode: false

      - name: Check CLAUDE.md size
        run: |
          budget=40000
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md: ${size} bytes (budget ${budget})"
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is ${size} bytes, over the ${budget}-byte budget. Move detail to its docs/architecture/ or docs/agents/ file and leave a pointer."
            exit 1
          fi
